# Bangladesh Army Cybersecurity Awareness Training Platform
# Full stack: Nginx (SPA) + API + PostgreSQL
#
# Usage:
#   docker compose up --build -d
#   open http://localhost

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ba_cyber_training
      POSTGRES_USER: ba_cyber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInProduction!}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ba_cyber -d ba_cyber_training"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ba-net

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://ba_cyber:${POSTGRES_PASSWORD:-ChangeMeInProduction!}@db:5432/ba_cyber_training
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-in-production-ba-cyber}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
      SESSION_TTL_HOURS: "8"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ba-net
    restart: unless-stopped

  api-init:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://ba_cyber:${POSTGRES_PASSWORD:-ChangeMeInProduction!}@db:5432/ba_cyber_training
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node src/db/migrate.js && node src/db/seed.js"]
    networks:
      - ba-net
    restart: "no"

  web:
    build:
      context: .
      target: web
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - ba-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  ba-net:
    driver: bridge
